name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        # RouteContext 등 라우트 타입은 Next가 생성한다 — 빌드 전에 tsc만 돌리면 없는 타입으로 실패했다
        # (2026-08-25~09-07 main CI 연속 실패 원인). typegen이 빌드 없이 그 타입만 만든다.
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        # 환경변수(ANTHROPIC_API_KEY, DATABASE_URL 등) 없이도 빌드는 통과한다(실측 확인,
        # 2026-07-16) — Route Handler 코드는 next build 시점에 실행되지 않고, DB/API 클라이언트는
        # 요청이 들어올 때 처음 연결을 시도하는 지연 초기화 방식이기 때문이다.

      # data/ 폴더(리바랩스 raw data, 응답자 개인정보 포함)는 커밋되지 않으므로 fidelity
      # 회귀 테스트(npm run check:golden)는 CI에서 돌지 않는다. 정량 계산 로직(lib/quant/,
      # lib/walla/)을 건드리는 PR은 로컬에서 반드시 `npm run check:golden`을 먼저 돌려
      # 전부 PASS인지 확인할 것 — CLAUDE.md 참고.
